name: Nuxt CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuxt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Prisma needs DATABASE_URL while its client and the Nitro bundle are built.
    # This temporary SQLite URL is only used by CI; production values belong in
    # the environment of the server that runs .output/server/index.mjs.
    env:
      CI: true
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      ENCRYPTION_SECRET: ci-only-encryption-secret-32-characters
      APP_URL: http://localhost:3000
      WHATSAPP_PROVIDER: baileys
      AI_PROVIDER: mock
      PAYMENT_PROVIDER: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Prepare Nuxt
        run: npx nuxt prepare

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build Nuxt server
        run: npm run build

      - name: Upload Node server artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-chat-node-${{ github.sha }}
          path: .output/
          if-no-files-found: error
          retention-days: 7
